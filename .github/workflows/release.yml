name: Build runtime release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build Debian GTK runtime libraries
        run: |
          set -euo pipefail
          docker build -f nm-plugin-anet-gtk-ui/Containerfile-debian -t anet-gtk-debian-release nm-plugin-anet-gtk-ui
          docker run --rm -v "$PWD/nm-plugin-anet-gtk-ui:/src" anet-gtk-debian-release \
            sh -c 'rm -rf build && cmake -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build -j2'
          cp nm-plugin-anet-gtk-ui/build/libnm-vpn-plugin-anet.so \
            "$RUNNER_TEMP/debian-libnm-vpn-plugin-anet.so"
          cp nm-plugin-anet-gtk-ui/build/libnm-vpn-plugin-anet-editor.so \
            "$RUNNER_TEMP/debian-libnm-vpn-plugin-anet-editor.so"
          cp nm-plugin-anet-gtk-ui/build/libnm-gtk4-vpn-plugin-anet-editor.so \
            "$RUNNER_TEMP/debian-libnm-gtk4-vpn-plugin-anet-editor.so"

      - name: Build Arch GTK runtime libraries
        run: |
          set -euo pipefail
          docker build -f nm-plugin-anet-gtk-ui/Containerfile-arch -t anet-gtk-arch-release nm-plugin-anet-gtk-ui
          docker run --rm -v "$PWD/nm-plugin-anet-gtk-ui:/src" anet-gtk-arch-release \
            sh -c 'rm -rf build && cmake -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build -j2'
          cp nm-plugin-anet-gtk-ui/build/libnm-vpn-plugin-anet.so \
            "$RUNNER_TEMP/arch-libnm-vpn-plugin-anet.so"
          cp nm-plugin-anet-gtk-ui/build/libnm-vpn-plugin-anet-editor.so \
            "$RUNNER_TEMP/arch-libnm-vpn-plugin-anet-editor.so"
          cp nm-plugin-anet-gtk-ui/build/libnm-gtk4-vpn-plugin-anet-editor.so \
            "$RUNNER_TEMP/arch-libnm-gtk4-vpn-plugin-anet-editor.so"

      - name: Build Debian Qt6 runtime library
        run: |
          set -euo pipefail
          docker build -f nm-plugin-anet-qt6-ui/Containerfile-debian -t anet-qt6-debian-release nm-plugin-anet-qt6-ui
          docker run --rm -v "$PWD/nm-plugin-anet-qt6-ui:/src" anet-qt6-debian-release \
            sh -c 'rm -rf build && cmake -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build -j2'
          QT_LIBRARY=$(find nm-plugin-anet-qt6-ui/build -type f -name 'plasmanetworkmanagement_anet-vpn_ui.so' -print -quit)
          test -n "$QT_LIBRARY"
          cp "$QT_LIBRARY" "$RUNNER_TEMP/debian-plasmanetworkmanagement_anet-vpn_ui.so"

      - name: Build Arch Qt6 runtime library
        run: |
          set -euo pipefail
          docker build -f nm-plugin-anet-qt6-ui/Containerfile-arch -t anet-qt6-arch-release nm-plugin-anet-qt6-ui
          docker run --rm -v "$PWD/nm-plugin-anet-qt6-ui:/src" anet-qt6-arch-release \
            sh -c 'rm -rf build && cmake -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build -j2'
          QT_LIBRARY=$(find nm-plugin-anet-qt6-ui/build -type f -name 'plasmanetworkmanagement_anet-vpn_ui.so' -print -quit)
          test -n "$QT_LIBRARY"
          cp "$QT_LIBRARY" "$RUNNER_TEMP/arch-plasmanetworkmanagement_anet-vpn_ui.so"

      - name: Assemble runtime package
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE="nm-plugin-anet-vpn-${VERSION}"
          STAGING="$RUNNER_TEMP/$PACKAGE"
          mkdir -p "$STAGING/config" "$STAGING/src" "$STAGING/lib"
          cp -a config/. "$STAGING/config/"
          cp -a src/. "$STAGING/src/"
          cp uninstall.sh README.md LICENSE "$STAGING/"
          cp install.sh.in "$STAGING/install.sh"
          chmod 755 "$STAGING/install.sh" "$STAGING/uninstall.sh"
          cp "$RUNNER_TEMP/debian-libnm-vpn-plugin-anet.so" "$STAGING/lib/"
          cp "$RUNNER_TEMP/debian-libnm-vpn-plugin-anet-editor.so" "$STAGING/lib/"
          cp "$RUNNER_TEMP/debian-libnm-gtk4-vpn-plugin-anet-editor.so" "$STAGING/lib/"
          cp "$RUNNER_TEMP/arch-libnm-vpn-plugin-anet.so" "$STAGING/lib/"
          cp "$RUNNER_TEMP/arch-libnm-vpn-plugin-anet-editor.so" "$STAGING/lib/"
          cp "$RUNNER_TEMP/arch-libnm-gtk4-vpn-plugin-anet-editor.so" "$STAGING/lib/"
          cp "$RUNNER_TEMP/debian-plasmanetworkmanagement_anet-vpn_ui.so" "$STAGING/lib/"
          cp "$RUNNER_TEMP/arch-plasmanetworkmanagement_anet-vpn_ui.so" "$STAGING/lib/"
          tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/$PACKAGE.tar.gz" "$PACKAGE"
          (cd "$RUNNER_TEMP" && zip -qr "$PACKAGE.zip" "$PACKAGE")
          printf '%s\n' "$STAGING" > "$RUNNER_TEMP/staging-path"
          printf '%s\n' "$PACKAGE" > "$RUNNER_TEMP/package-name"

      - name: Verify runtime package contents
        run: |
          set -euo pipefail
          PACKAGE=$(cat "$RUNNER_TEMP/package-name")
          STAGING=$(cat "$RUNNER_TEMP/staging-path")
          test -x "$STAGING/install.sh"
          bash -n "$STAGING/install.sh"
          grep -q 'cinnamon' "$STAGING/install.sh"
          grep -q 'ldd -r' "$STAGING/install.sh"
          test -f "$STAGING/lib/debian-libnm-vpn-plugin-anet.so"
          test -f "$STAGING/lib/debian-libnm-vpn-plugin-anet-editor.so"
          test -f "$STAGING/lib/debian-libnm-gtk4-vpn-plugin-anet-editor.so"
          test -f "$STAGING/lib/arch-libnm-vpn-plugin-anet.so"
          test -f "$STAGING/lib/arch-libnm-vpn-plugin-anet-editor.so"
          test -f "$STAGING/lib/arch-libnm-gtk4-vpn-plugin-anet-editor.so"
          test -f "$STAGING/lib/debian-plasmanetworkmanagement_anet-vpn_ui.so"
          test -f "$STAGING/lib/arch-plasmanetworkmanagement_anet-vpn_ui.so"
          test "$(find "$STAGING/lib" -maxdepth 1 -type f -name '*.so' | wc -l)" -eq 8
          tar -tzf "$RUNNER_TEMP/$PACKAGE.tar.gz"

      - name: Upload runtime package artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: nm-plugin-anet-vpn-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/nm-plugin-anet-vpn-*.tar.gz
            ${{ runner.temp }}/nm-plugin-anet-vpn-*.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PACKAGE=$(cat "$RUNNER_TEMP/package-name")
          gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP/$PACKAGE.tar.gz" "$RUNNER_TEMP/$PACKAGE.zip" \
            --title "$GITHUB_REF_NAME" --generate-notes
